name: relay-runner

# Every job in this file is a free egress address: a fresh VM, a fresh IP, no card, no key.
# This is the rotating pool the relay fabric was missing.
#
# Triggered by the app (POST /repos/{repo}/actions/workflows/relay.yml/dispatches) in one of two modes:
#
#   artifact  (default)  inputs: { job: '{"id","url","method","headers","body"}' }
#                        The runner performs the request and uploads {status, headers, body_b64} as an
#                        artifact. The app downloads it. No inbound socket needed, works from anywhere.
#
#   queue                inputs: { host, key, seconds }
#                        The runner long-polls a relay host (relays/relay.mjs) and answers jobs live.

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'JSON job: {"id","url","method","headers","body"}'
        required: false
        default: ''
      host:
        description: 'Relay host base URL for queue mode, e.g. https://relay.example.com'
        required: false
        default: ''
      key:
        description: 'Optional shared secret (x-relay-key)'
        required: false
        default: ''
      seconds:
        description: 'How long a queue-mode runner stays available'
        required: false
        default: '60'

concurrency:
  group: relay-runner-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Report the address this runner is using
        run: |
          ADDR=$(curl -sS --max-time 10 https://api.ipify.org || echo unknown)
          echo "egress address: $ADDR"
          echo "EGRESS_ADDR=$ADDR" >> "$GITHUB_ENV"

      # ── artifact mode ────────────────────────────────────────────────────────────────────────────
      - name: Execute the relayed request
        if: ${{ github.event.inputs.job != '' }}
        env:
          JOB: ${{ github.event.inputs.job }}
          EGRESS_ADDR: ${{ env.EGRESS_ADDR }}
        run: |
          # curl, not urllib: several hosts answer 307 and expect the body re-posted, and urllib's
          # redirect handler does not re-POST. curl also keeps multi-megabyte media in a file instead
          # of a Python bytes object.
          python3 - <<'PY'
          import os, json, base64, subprocess, shlex
          job = json.loads(os.environ['JOB'])
          url, method = job['url'], (job.get('method') or 'GET').upper()
          headers = {k: str(v) for k, v in (job.get('headers') or {}).items()}
          headers.setdefault('user-agent', 'Mozilla/5.0 (compatible; revenge-runner-fabric/1.0)')
          cmd = ['curl', '-sS', '-L', '--max-time', '840', '-X', method,
                 '-D', 'headers.txt', '-o', 'body.bin', '-w', '%{http_code}', url]
          for k, v in headers.items():
              cmd += ['-H', f'{k}: {v}']
          body = job.get('body')
          if body not in (None, ''):
              open('payload.bin', 'w').write(body if isinstance(body, str) else json.dumps(body))
              cmd += ['--data-binary', '@payload.bin']
          try:
              status = int(subprocess.run(cmd, capture_output=True, check=False).stdout.decode().strip() or 0)
          except Exception:
              status = 0
          raw = open('body.bin', 'rb').read() if os.path.exists('body.bin') else b''
          hdrs = {}
          if os.path.exists('headers.txt'):
              for block in open('headers.txt', encoding='utf8', errors='replace').read().split('\r\n\r\n'):
                  for line in block.splitlines():
                      if ':' in line and not line.split(':', 1)[0].startswith('HTTP'):
                          k, v = line.split(':', 1)
                          hdrs[k.strip().lower()] = v.strip()      # last hop wins
          out = {'id': job.get('id'), 'address': os.environ.get('EGRESS_ADDR'),
                 'status': status or 502, 'headers': hdrs,
                 'body_b64': base64.b64encode(raw).decode()}
          out['headers']['x-egress-address'] = os.environ.get('EGRESS_ADDR', 'unknown')
          with open('response.json', 'w') as f:
              json.dump(out, f)
          print('status', out['status'], 'bytes', len(raw), 'address', out['address'])
          PY

      - name: Upload the answer
        if: ${{ github.event.inputs.job != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: relay-response
          path: response.json
          retention-days: 1
          if-no-files-found: error

      # ── queue mode ───────────────────────────────────────────────────────────────────────────────
      - name: Serve relay jobs from a standing host
        if: ${{ github.event.inputs.host != '' }}
        env:
          RELAY_HOST: ${{ github.event.inputs.host }}
          RELAY_KEY: ${{ github.event.inputs.key }}
          RUN_SECONDS: ${{ github.event.inputs.seconds }}
        run: |
          chmod +x runner.sh
          ./runner.sh

      - name: Nothing to do
        if: ${{ github.event.inputs.job == '' && github.event.inputs.host == '' }}
        run: echo "dispatched with no job - this was an address check only"
